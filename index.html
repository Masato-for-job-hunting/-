<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文学部 就職先データ</title><link rel="stylesheet" href="styles.css?v=33"></head><body><header><div class="wrap"><p class="eyebrow">LITERATURE CAREER DATA</p><h1>文学部の就職先を<br>4年間で見る</h1></div></header><main class="wrap"><section class="panel"><p class="eyebrow">01 / INDUSTRIES</p><h2>公式業種別の構成</h2><div class="pie-layout"><div id="pie" class="pie"><div class="pie-center"><b>1,620人</b><span>4年間掲載分</span></div></div><div id="legend"></div></div></section><section class="panel"><p class="eyebrow">02 / COMPANIES</p><h2>企業別人数</h2><div class="filters"><label>公式業種<select id="sector"><option value="all">全業種</option></select></label><label>注目区分<select id="focus"><option value="all">すべて</option><option>金融</option><option>コンサル</option><option>商社</option><option value="other">その他</option></select></label><label>企業グループ<div id="quick" class="quick"></div><select id="preset"><option value="all">すべての企業グループ</option></select></label><label>企業名<input id="query" type="search" placeholder="例：アクセンチュア"></label><div id="info" class="info" hidden></div><button id="apply" type="button">この条件で表示</button><button id="reset" type="button" class="sub">条件をリセット</button></div><div id="result" class="result"></div><div id="bars"></div><button id="more" type="button" class="more">次の20社を表示</button></section></main><script src="data.js?v=33"></script><script src="app.js?v=33"></script></body></html>
